name: Check sources
# On every change: each source follows the rules Kitab applies, and index.json matches the files.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['sources/**', 'index.json', 'packs.json', 'tools/**']

permissions:
  contents: read

jobs:
  check:
    name: Validate sources and index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every source, and that index.json matches them
        run: node tools/build-index.mjs --check
