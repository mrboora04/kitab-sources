name: Daily check
# Every day, run each source against the real websites the way Kitab does (Kitab's own recipe code),
# write status.json (Kitab reads it to mark a source that is not working right now), and keep one issue
# open per broken source until it works again.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sources/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  live:
    name: Try every source on the real sites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the catalogs (whole lists of books from libraries without a search API)
        continue-on-error: true          # if a site changed, yesterday's catalog stays and the check below reports it
        run: |
          for f in tools/catalogs/*.mjs; do node "$f" || echo "::warning::$f failed"; done

      - name: Check
        run: |
          node tools/live-check.mjs
          cat status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # another run may have saved its results meanwhile: always write ours onto the newest main
          mkdir -p "$RUNNER_TEMP/out" && cp -r status.json status.md catalogs "$RUNNER_TEMP/out/"
          for try in 1 2 3; do
            git fetch -q origin main && git checkout -q -B main origin/main
            cp -r "$RUNNER_TEMP/out/status.json" "$RUNNER_TEMP/out/status.md" "$RUNNER_TEMP/out/catalogs" .
            git add status.json status.md catalogs
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "Daily check $(date -u +%F) [skip ci]"
            git push -q origin main && exit 0
            sleep $((try * 5))
          done
          exit 1

      - name: Open or close an issue per source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/issues.mjs
