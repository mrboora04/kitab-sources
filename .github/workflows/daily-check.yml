name: Daily check
# Every day, run each source against the real websites the way Kitab does (Kitab's own recipe code),
# write status.json (Kitab reads it to mark a source that is not working right now), and keep one issue
# open per broken source until it works again.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sources/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  live:
    name: Try every source on the real sites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check
        run: |
          node tools/live-check.mjs
          cat status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json status.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Daily check $(date -u +%F) [skip ci]"
          git pull --rebase --autostash origin main
          git push

      - name: Open or close an issue per source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/issues.mjs
